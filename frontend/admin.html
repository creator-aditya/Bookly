<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookly - Admin Upload</title>

  <script src="/js/guard.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 { margin-bottom: 30px; }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input,
    textarea,
    button {
      padding: 12px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }

    .purchases-section {
      margin-top: 48px;
      border-top: 1px solid #eee;
      padding-top: 24px;
    }

    .purchases-section h2 {
      margin: 0 0 12px;
    }

    .purchases-section .hint {
      color: #777;
      font-size: 13px;
      margin: 0 0 12px;
    }

    .purchase-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    .purchase-card .row {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
      word-break: break-word;
    }

    .purchase-card .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .purchase-card button {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
    }

    .purchase-card button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .purchase-card .btn-paid   { background: #1b5e20; }
    .purchase-card .btn-reject { background: #b71c1c; }

    .empty {
      color: #888;
      font-size: 14px;
      padding: 12px 0;
    }
  </style>
</head>

<body>

  <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
    <h1 style="margin:0;">Admin — Upload Book</h1>
    <button id="logout" style="cursor:pointer; padding:8px 16px;">Logout</button>
  </header>

  <form id="uploadForm">

    <input
      type="text"
      id="title"
      placeholder="Book title"
      required
    >

    <input
      type="text"
      id="author"
      placeholder="Author"
      required
    >

    <textarea
      id="description"
      placeholder="Book description"
      required
    ></textarea>

    <input
      type="text"
      id="category"
      placeholder="Category (e.g. Technology)"
      required
    >

    <input
      type="text"
      id="genre"
      placeholder="Genre (e.g. Cybersecurity)"
      required
    >

    <input
      type="number"
      id="price"
      placeholder="Price in INR (0 for free)"
      min="0"
      step="0.01"
      value="0"
      required
    >

    <label>Select PDF or EPUB:</label>

    <input
      type="file"
      id="book"
      accept=".pdf,.epub,application/pdf,application/epub+zip"
      required
    >

    <button type="submit">Upload Book</button>

  </form>

  <p id="message"></p>

  <!-- =========================
       PENDING PURCHASES (MANUAL UPI)
  ========================= -->

  <section class="purchases-section">
    <h2>Pending purchases</h2>
    <p class="hint">
      Verify the UTR against your bank / UPI app before clicking "Mark paid".
    </p>
    <button id="refreshPurchases" style="padding:8px 16px;font-size:14px;">Refresh</button>
    <div id="purchaseList" style="margin-top:16px;"></div>
  </section>

  <script src="/js/util.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin-purchases.js"></script>

</body>
</html>
