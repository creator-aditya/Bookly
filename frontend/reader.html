<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Book Reader</title>

  <style>
    :root {
      --chrome: #1c1c1c;
      --chrome-line: #333;
      --fg: #ffffff;
      --fg-soft: #aaaaaa;
      --error: #ff7777;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      color: var(--fg);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .reader-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--chrome);
      border-bottom: 1px solid var(--chrome-line);
    }

    .book-info {
      min-width: 0;
      overflow: hidden;
    }

    .book-info h1 {
      margin: 0;
      font-size: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .book-info p {
      margin: 4px 0 0;
      color: var(--fg-soft);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .back-btn {
      flex-shrink: 0;
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      border: 1px solid #444;
      border-radius: 6px;
      transition: background .15s ease;
    }

    .back-btn:hover {
      background: #333;
    }

    #message {
      display: none;
      position: absolute;
      top: 80px;
      left: 0;
      right: 0;
      text-align: center;
      padding: 40px 20px;
      color: var(--error);
      z-index: 20;
      font-size: 15px;
    }

    #reader {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
      background: #ffffff;
      z-index: 1;
    }
  </style>
</head>

<body>

  <header class="reader-header">
    <div class="book-info">
      <h1 id="bookTitle">Loading book…</h1>
      <p id="bookAuthor"></p>
    </div>
    <a href="/home.html" class="back-btn">← Back</a>
  </header>

  <div id="message"></div>

  <iframe
    id="reader"
    title="Book Reader"></iframe>

  <script src="/js/reader.js"></script>

</body>
</html>
