<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Reader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .reader-header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #1c1c1c;
      border-bottom: 1px solid #333;
    }

    .book-info h1 {
      margin: 0;
      font-size: 18px;
    }

    .book-info p {
      margin: 4px 0 0;
      color: #aaa;
      font-size: 13px;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      border: 1px solid #444;
      border-radius: 6px;
    }

    .back-btn:hover {
      background: #333;
    }

    #reader {
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
      background: white;
    }

    #message {
      display: none;
      text-align: center;
      padding: 40px 20px;
      color: #ff7777;
    }
  </style>
</head>

<body>

  <header class="reader-header">

    <div class="book-info">
      <h1 id="bookTitle">Loading book...</h1>
      <p id="bookAuthor"></p>
    </div>

    <a href="/home.html" class="back-btn">
      ← Back
    </a>

  </header>

  <div id="message"></div>

  <iframe
    id="reader"
    title="Book Reader">
  </iframe>

  <script src="/js/reader.js"></script>

</body>
</html>
